
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AppInsight – Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style-2.css"/>
</head>

<body class="form-page">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
<div class="card-header">
  <h2>Log In</h2>
  <p>Welcome back!</p>
</div>

<div class="form-group">
  <label>Email</label>
  <input type="email" placeholder="Email Address"/>
</div>

<div class="form-group">
  <label>Password</label>
  <div class="input-wrap">
    <input type="password" id="pass" placeholder="**********"/>
    <button class="eye-btn" onclick="toggle('pass', this)">👁️</button>
  </div>
</div>

<div class="form-row">
  <a href="forgot-password.html">Forget Password?</a>
  <a href="login-admin.html" class="admin-link">Log in as Admin →</a>
</div>

<button class="btn-primary">Log in</button>

<p class="footer-text">Don't have an account? <a href="signup.html">sign up</a></p>

  </div>

 <script>
    function toggle(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {input.type = 'text'; btn.textContent = '👁️⃠'; } 
      else {input.type = 'password'; btn.textContent = '👁️'; }
    }
  </script>

</body class="form-page">
</html>
